name: Docker Build and Push

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify tag version
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('package.json', encoding='utf-8') as package_file:
              version = json.load(package_file)['version']

          expected_tag = f'v{version}'
          actual_tag = os.environ['GITHUB_REF_NAME']
          if actual_tag != expected_tag:
              raise SystemExit(
                  f'Git tag {actual_tag!r} must match package version {expected_tag!r}'
              )
          PY

      - name: Verify Node support baseline matches latest LTS
        run: >-
          node -e "const { engines } = require('./package.json');
          const expected = '>=' + process.versions.node.split('.')[0];
          if (engines.node !== expected)
          throw new Error('package.json engines.node must be ' + expected + ' for the latest Node.js LTS');"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release validation gate
        run: |
          bun run lint:all
          bun run typecheck
          bun test --path-ignore-patterns='**/token-file-removal.test.ts' --path-ignore-patterns='**/token-refresh-retry.test.ts'
          bun test tests/token-file-removal.test.ts tests/token-refresh-retry.test.ts
          bun run build
          bun run smoke:packaged

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
