name: Release NPM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate project
        run: |
          bun run lint:all
          bun run typecheck
          bun test --path-ignore-patterns='**/token-file-removal.test.ts' --path-ignore-patterns='**/token-refresh-retry.test.ts' && bun test tests/token-file-removal.test.ts tests/token-refresh-retry.test.ts
          bun run build
          bun run smoke:packaged

      - name: Verify npm pack lifecycle (prepack -> tsdown)
        run: npm pack --dry-run

      - name: Verify tarball ships no source maps
        run: |
          # tsdown (prepack) logs to stdout, so parse the file listing npm
          # prints to stderr rather than --json. Fail if any .map is packed;
          # trimming lives in package.json "files": dist/**/*.mjs.
          MAPS="$(npm pack --dry-run 2>&1 >/dev/null | grep -oE 'dist/[^ ]+\.map' || true)"
          if [ -n "$MAPS" ]; then
            echo "Source maps must not ship to npm (files should stay dist/**/*.mjs):"
            echo "$MAPS"
            exit 1
          fi
          echo "OK: no .map files in tarball"

      - name: Validate release tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(bun -e "const pkg = await Bun.file('package.json').json(); console.log(pkg.version)")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Generate release notes
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to npm
        run: npm publish --access public
