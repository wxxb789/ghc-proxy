name: Release NPM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  msc-auth:
    name: Build Windows credential helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish native helper
        run: dotnet publish msc-auth -c Release -r win-x64 -p:PublishAot=true -p:DebugType=none -o msc-auth-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msc-auth
          path: msc-auth-artifact/
          if-no-files-found: error

  publish:
    needs: msc-auth
    runs-on: ubuntu-latest
    env:
      MSC_AUTH_DIR: msc-auth-artifact
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: msc-auth
          path: msc-auth-artifact

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Verify Node support baseline matches latest LTS
        run: >-
          node -e "const { engines } = require('./package.json');
          const expected = '>=' + process.versions.node.split('.')[0];
          if (engines.node !== expected)
          throw new Error('package.json engines.node must be ' + expected + ' for the latest Node.js LTS');"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and smoke test packaged CLI on Bun 1.4.0
        run: |
          bun run build
          bun run smoke:packaged

      - name: Set up latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Validate project
        run: |
          bun run lint:all
          bun run typecheck
          bun test --path-ignore-patterns='**/token-file-removal.test.ts' --path-ignore-patterns='**/token-refresh-retry.test.ts' && bun test tests/token-file-removal.test.ts tests/token-refresh-retry.test.ts
          bun run build
          bun run smoke:packaged

      - name: Set up Node Current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: current

      - name: Build and smoke test packaged CLI on Node Current
        run: |
          bun run build
          bun run smoke:packaged

      - name: Set up latest Node LTS for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Verify npm pack lifecycle (prepack -> tsdown)
        run: npm pack --dry-run

      - name: Verify tarball ships no source maps
        run: |
          # tsdown (prepack) logs to stdout, so parse the file listing npm
          # prints to stderr rather than --json. Fail if any .map is packed;
          # trimming lives in package.json "files": dist/**/*.mjs.
          MAPS="$(npm pack --dry-run 2>&1 >/dev/null | grep -oE 'dist/[^ ]+\.map' || true)"
          if [ -n "$MAPS" ]; then
            echo "Source maps must not ship to npm (files should stay dist/**/*.mjs):"
            echo "$MAPS"
            exit 1
          fi
          echo "OK: no .map files in tarball"

      - name: Verify tarball ships the Windows helper
        run: |
          # The helper is built by the msc-auth job and copied into dist/ by
          # scripts/build-msc-auth.mjs during prepack. A missing payload would
          # silently publish a package whose Windows provider cannot work.
          LISTING="$(npm pack --dry-run 2>&1 >/dev/null)"
          for FILE in dist/msc-auth/msc-auth.exe dist/msc-auth/msalruntime.dll; do
            if ! printf '%s' "$LISTING" | grep -q "$FILE"; then
              echo "Missing $FILE in the tarball (MSC_AUTH_DIR=$MSC_AUTH_DIR)"
              exit 1
            fi
          done
          echo "OK: Windows helper is packed"

      - name: Validate release tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(bun -e "const pkg = await Bun.file('package.json').json(); console.log(pkg.version)")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Generate release notes
        run: bunx changelogithub@15.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to npm
        run: npm publish --access public
