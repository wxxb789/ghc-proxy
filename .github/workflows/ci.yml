name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Verify Node support baseline matches latest LTS
        run: >-
          node -e "const { engines } = require('./package.json');
          const expected = '>=' + process.versions.node.split('.')[0];
          if (engines.node !== expected)
          throw new Error('package.json engines.node must be ' + expected + ' for the latest Node.js LTS');"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint:all

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        # token-file-removal and token-refresh-retry call
        # mock.module('../src/clients/github-client'), whose stub leaks across
        # files via Bun's process-wide module-mock registry and breaks
        # clients-auth's real-GitHubClient URL routing tests. Run those two in a
        # separate process so the main run always sees the real module.
        # Remove the split once Bun isolates mock.module() per file.
        run: >-
          bun test
          --path-ignore-patterns='**/token-file-removal.test.ts'
          --path-ignore-patterns='**/token-refresh-retry.test.ts'
          && bun test tests/token-file-removal.test.ts tests/token-refresh-retry.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test packaged CLI
        run: bun run smoke:packaged

  node-current:
    name: Node Current compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: current

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test packaged CLI
        run: bun run smoke:packaged

  windows-bun-floor:
    name: Windows Bun 1.4 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test packaged CLI
        run: bun run smoke:packaged

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull -t ghc-proxy:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect ghc-proxy:ci --format '{{.Config.User}}')" = bun

      - name: Verify persisted data directory is writable
        run: |
          volume="ghc-proxy-ci-${GITHUB_RUN_ID}"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm \
            --mount "source=$volume,target=/home/bun/.local/share/ghc-proxy" \
            --entrypoint sh \
            ghc-proxy:ci \
            -c 'touch /home/bun/.local/share/ghc-proxy/.write-test'

      - name: Verify CLI entrypoint
        run: |
          docker run --rm ghc-proxy:ci selfcheck --json
          docker run --rm ghc-proxy:ci debug --json
          docker run --rm ghc-proxy:ci --auth --help
